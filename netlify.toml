# Netlify Configuration

[build]
  publish = "."

# Serverless fonksiyonlar (aday başvurusunda CV'yi ek yaparak mail atan submission-created)
# Node 18+ (global fetch); secret'lar Netlify panel ortam değişkenlerinde tutulur.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect www to non-www
[[redirects]]
  from = "https://www.talevo.com.tr/*"
  to = "https://talevo.com.tr/:splat"
  status = 301
  force = true

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # HSTS: Netlify zaten gönderiyor; burada garanti altına alınır (version-controlled).
    # includeSubDomains YOK — tüm alt alanların (crm.talevo.com.tr vb.) HTTPS uyumu
    # doğrulanmadan eklemek riskli/geri dönüşü zor. preload de eklenmez.
    Strict-Transport-Security = "max-age=31536000"
    # CSP — ŞİMDİLİK Report-Only (hiçbir şeyi ENGELLEMEZ; yalnız ihlal raporlar → deploy güvenli).
    # Site gerçekleri: tüm CSS/JS inline; 8 font + görseller data: URI; favicon.png same-origin;
    # form aynı origin'e POST (Netlify Forms); üçüncü taraf kaynak YOK.
    # style-src 'unsafe-inline' ŞART: inline <style> + JS'in yazdığı element.style (scroll animasyonları).
    # script-src 'unsafe-inline' ŞİMDİLİK: inline ana JS + JSON-LD. 'unsafe-eval' YOK (gerekmiyor).
    # Rapor endpoint'i (report-uri/report-to) YOK: Netlify'da toplama yok; konsol ihlalleri yeterli.
    # Zorlamaya (enforce) geçiş: bu başlığı Content-Security-Policy'ye çevir (Report-Only sonrası).
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
